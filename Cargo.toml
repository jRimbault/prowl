[package]
name = "prowl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "prowl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", default-features = false, features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
procfs = { version = "0.18.0", features = ["chrono"] }
ratatui = "0.30.0"
tokio = { version = "1.52.2", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
# Snapshot tests for ratatui rendering (see src/ui/**/tests).
# Run `cargo insta review` to inspect and approve UI changes.
insta = "1.40"
